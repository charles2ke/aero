[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aero"
version = "0.1.0"
description = "Aerospace engineering calculations: atmosphere, aerodynamics, and orbital mechanics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"

[tool.setuptools]
packages = ["aero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
